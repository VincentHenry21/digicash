name: iOS Build and Test

# Verifies the DigiCash native app actually compiles and passes tests
# on real Apple infrastructure (GitHub-hosted macOS runners with Xcode).
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting newest Xcode: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          else
            echo "No Xcode_*.app found, using runner default"
          fi
          xcodebuild -version

      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices --json | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          best = None
          for runtime, devs in sorted(d['devices'].items()):
              if 'iOS-' not in runtime and 'iOS ' not in runtime:
                  continue
              for x in devs:
                  if x.get('isAvailable') and 'iPhone' in x.get('name',''):
                      best = x['udid']
          if not best:
              print('NO_AVAILABLE_IPHONE_SIMULATOR'); sys.exit(1)
          print(best)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      - name: Build (iPhone simulator, unsigned)
        run: |
          xcodebuild build \
            -project native/DigiCash.xcodeproj \
            -scheme DigiCash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/digicash-dd \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project native/DigiCash.xcodeproj \
            -scheme DigiCash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath /tmp/digicash-dd \
            -only-testing:DigiCashTests \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
