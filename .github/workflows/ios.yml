name: iOS Build and Test

# Verifies the DigiCash native app actually compiles and passes tests
# on real Apple infrastructure (GitHub-hosted macOS runners with Xcode).
on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting newest Xcode: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          else
            echo "No Xcode_*.app found, using runner default"
          fi
          xcodebuild -version

      - name: Build (iPhone simulator, unsigned)
        run: |
          xcodebuild build \
            -project native/DigiCash.xcodeproj \
            -scheme DigiCash \
            -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
            -derivedDataPath /tmp/digicash-dd \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project native/DigiCash.xcodeproj \
            -scheme DigiCash \
            -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
            -derivedDataPath /tmp/digicash-dd \
            -only-testing:DigiCashTests \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
