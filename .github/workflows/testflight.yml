name: TestFlight Upload

# Manual lane: archives a signed release build and uploads it to TestFlight.
# Requires an Apple Developer Program membership ($99/year) and these
# repository secrets:
#
#   APPLE_API_KEY_ID        App Store Connect API key ID
#   APPLE_API_ISSUER_ID     App Store Connect API issuer ID
#   APPLE_API_PRIVATE_KEY   App Store Connect API private key (.p8 contents)
#   APPLE_TEAM_ID           Apple Developer Team ID (10 characters)
#   SIGNING_CERTIFICATE_P12 Base64 of the distribution .p12 certificate
#   SIGNING_CERTIFICATE_PWD Password of the .p12
#   PROVISION_PROFILE       Base64 of the App Store distribution provisioning profile
#                           for bundle id com.digicash.app
#
# See native/README.md for the one-time setup on a Mac.

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          else
            echo "Xcode 16.2 not present, using runner default"
          fi
          xcodebuild -version

      - name: Install signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.SIGNING_CERTIFICATE_PWD }}

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.PROVISION_PROFILE }}" | base64 --decode > \
            ~/Library/MobileDevice/Provisioning\ Profiles/digicash.mobileprovision

      - name: Archive
        run: |
          xcodebuild archive \
            -project native/DigiCash.xcodeproj \
            -scheme DigiCash \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/DigiCash.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="DigiCash App Store"

      - name: Export IPA
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath /tmp/DigiCash.xcarchive \
            -exportPath /tmp/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: /tmp/export/DigiCash.ipa
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}
